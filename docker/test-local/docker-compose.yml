services:
  # === Reverse proxy — HTTPS + routing ===
  caddy:
    image: caddy:latest
    container_name: caddy-test
    ports:
      - "443:443"
      - "8443:8443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
    networks:
      - stack
    depends_on:
      - continuwuity
      - cinny
      - pocket-id

  # === Matrix homeserver with SSO ===
  continuwuity:
    image: continuwuity-sso:latest
    container_name: continuwuity-test
    volumes:
      - ./continuwuity.toml:/etc/continuwuity.toml:ro
      - continuwuity-data:/var/lib/continuwuity
      - ./shared/pocket-id-client-secret:/run/secrets/pocket-id-client-secret:ro
      - ./shared/pocket-id-static-api-key:/run/secrets/pocket-id-static-api-key:ro
    environment:
      CONTINUWUITY_CONFIG: "/etc/continuwuity.toml"
    networks:
      - stack

  # === Matrix web client ===
  cinny:
    image: cinny-voice:latest
    container_name: cinny-test
    volumes:
      - ./cinny-config.json:/app/config.json:ro
    networks:
      - stack

  # === Pocket ID: OIDC identity provider ===
  pocket-id:
    image: ghcr.io/pocket-id/pocket-id:v2
    container_name: pocket-id-test
    environment:
      APP_URL: "https://localhost:8443"
      INTERNAL_APP_URL: "http://pocket-id:1411"
      ENCRYPTION_KEY_FILE: "/run/secrets/pocket-id-encryption-key"
      STATIC_API_KEY_FILE: "/run/secrets/pocket-id-static-api-key"
      SMTP_HOST: "mail.isfluid.com"
      SMTP_PORT: "465"
      SMTP_FROM: "meow@fluiid.party"
      SMTP_USER: "meow@fluiid.party"
      SMTP_PASSWORD_FILE: "/run/secrets/pocket-id-smtp-password"
      SMTP_TLS: "tls"
      TRUST_PROXY: "true"
      UI_CONFIG_DISABLED: "true"
      APP_NAME: "fluiid.party"
      ALLOW_USER_SIGNUPS: "withToken"
      EMAILS_VERIFIED: "true"
      REQUIRE_USER_EMAIL: "true"
      EMAIL_LOGIN_NOTIFICATION_ENABLED: "true"
      EMAIL_VERIFICATION_ENABLED: "true"
      EMAIL_ONE_TIME_ACCESS_AS_ADMIN_ENABLED: "true"
      EMAIL_ONE_TIME_ACCESS_AS_UNAUTHENTICATED_ENABLED: "true"
      EMAIL_API_KEY_EXPIRATION_ENABLED: "true"
      VERSION_CHECK_DISABLED: "true"
      ANALYTICS_DISABLED: "true"
    volumes:
      - pocket-id-data:/app/data
      - ./shared/pocket-id-encryption-key:/run/secrets/pocket-id-encryption-key:ro
      - ./shared/pocket-id-static-api-key:/run/secrets/pocket-id-static-api-key:ro
      - ./shared/pocket-id-smtp-password:/run/secrets/pocket-id-smtp-password:ro
    healthcheck:
      test: ["CMD", "/app/pocket-id", "healthcheck"]
      interval: 1m30s
      timeout: 5s
      retries: 2
      start_period: 10s
    networks:
      stack:
        aliases:
          - pocket-id.internal

volumes:
  continuwuity-data:
  pocket-id-data:

networks:
  stack:
