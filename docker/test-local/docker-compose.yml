services:
  # === Reverse proxy — HTTPS + routing ===
  caddy:
    image: caddy:latest
    container_name: caddy-test
    ports:
      - "443:443"
      - "8443:8443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
    networks:
      - stack
    depends_on:
      - continuwuity
      - cinny

  # === Matrix homeserver with SSO ===
  continuwuity:
    image: continuwuity-sso:latest
    container_name: continuwuity-test
    volumes:
      - ./continuwuity.toml:/etc/continuwuity.toml:ro
      - continuwuity-data:/var/lib/continuwuity
    environment:
      CONTINUWUITY_CONFIG: "/etc/continuwuity.toml"
    networks:
      - stack

  # === Matrix web client ===
  cinny:
    image: cinny-voice:latest
    container_name: cinny-test
    volumes:
      - ./cinny-config.json:/app/config.json:ro
    networks:
      - stack

  # === Rauthy: OIDC identity provider ===
  rauthy:
    image: ghcr.io/sebadob/rauthy:0.34.3
    container_name: rauthy-test
    environment:
      - LOCAL_TEST=true
      - PUB_URL=localhost:8443
      - SMTP_URL=mail.isfluid.com
      - SMTP_PORT=465
      - SMTP_USERNAME=meow@fluiid.party
      - SMTP_PASSWORD=w1#$$336%*6x$$H%FUXfFG
      - SMTP_FROM=meow@fluiid.party
      - OPEN_USER_REG=true
      - BOOTSTRAP_ADMIN_EMAIL=me@isfluid.com
      - BOOTSTRAP_ADMIN_PASSWORD_PLAIN=Admin123!
    volumes:
      - rauthy-data:/app/data
    networks:
      stack:
        aliases:
          - rauthy.internal

volumes:
  continuwuity-data:
  rauthy-data:

networks:
  stack:
