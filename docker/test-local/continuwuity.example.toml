[global]
server_name = "localhost"
database_path = "/var/lib/continuwuity"
port = [8008]
address = "0.0.0.0"

allow_registration = false

allow_federation = false
allow_local_presence = false

# Local harness default: any authenticated Zitadel user gets a Matrix account.
# Set this to false to exercise invite-only onboarding.
sso_allow_open_registration = true

[global.well_known]
client = "https://localhost"

# Zitadel as OIDC identity provider
# Copy this file to `continuwuity.toml` and fill in the local app credentials.
[global.identity_provider.zitadel]
brand = "zitadel"
client_id = "REPLACE_WITH_LOCAL_ZITADEL_CLIENT_ID"
client_secret = "REPLACE_WITH_LOCAL_ZITADEL_CLIENT_SECRET"
issuer_url = "http://localhost:8080"
discovery = false
authorization_url = "http://localhost:8080/oauth/v2/authorize"
token_url = "http://zitadel:8080/oauth/v2/token"
userinfo_url = "http://zitadel:8080/oidc/v1/userinfo"
default = true
# Set this to true only if you want verified-email-based linking to existing
# local Matrix accounts.
# trusted = true
name = "fluiid.party"
scope = ["openid", "profile", "email"]
